global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape the collector's Prometheus exporter (your app metrics via OTLP)
  - job_name: 'otel-collector-exporter'
    static_configs:
      - targets: ['otel-collector:9464']

  # Scrape the collector's own telemetry (diagnostics)
  - job_name: 'otel-collector-telemetry'
    static_configs:
      - targets: ['otel-collector:8888']

  # Triton don't export metrics to otel, only support endpoint for prometheus
  - job_name: 'triton'
    static_configs:
      - targets: ['triton:8002']

