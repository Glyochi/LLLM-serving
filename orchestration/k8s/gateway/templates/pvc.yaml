{{- if .Values.mountedCode.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mountedCode.pvc.name }}
  namespace: {{ .Values.mountedCode.pvc.namespace }}
spec:
  accessModes: {{ toJson .Values.mountedCode.pvc.accessModes }}
  resources:
    requests:
      storage: {{ .Values.mountedCode.pvc.size }}
  storageClassName: {{ .Values.mountedCode.pvc.storageClassName | quote }}
  volumeName: {{ .Values.mountedCode.pvc.volumeName }}
{{- end }}
