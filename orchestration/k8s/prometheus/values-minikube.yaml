server:
  persistentVolume:
    enabled: true
    size: 10Gi
    accessModes: ["ReadWriteOnce"]
    storageClass: standard  # (minikube default; uncomment if needed)

  # Have to make this init container to change permission. Not entirely sure why this only happens when running in multiple nodes setup
  extraInitContainers:
  - name: volume-permissions
    image: busybox:1.36
    command: ["sh","-c","chown -R 65534:65534 /data || true"]
    securityContext:
      runAsUser: 0
    volumeMounts:
      - name: storage-volume   # name must match the server's data volume in the chart
        mountPath: /data
