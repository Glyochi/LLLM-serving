replicaCount: 1

image:
  pullPolicy: IfNotPresent
  numGpus: 1

service:
  type: ClusterIP

pv:
  name: local-triton-models-pv
  size: 100Gi
  hostPath: /mnt/projects/inference-server/model-repository
  storageClassName: ""     # empty => 'no storage class'
  accessModes: ["ReadWriteOnce"]
  reclaimPolicy: Retain     # change to Delete if you want Helm uninstall to remove data

pvc:
  name: triton-models-pvc
  namespace: observability  # where Triton runs
  size: 100Gi
  storageClassName: ""      # must match PV
  accessModes: ["ReadWriteOnce"]
  volumeName: local-triton-models-pv

modelRepository:
  name: triton-models-pvc

opentelemetry: 
  url: "http://otel-edge-opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces"
